<body>
<style>
  :root{
    --cream:#efe5d5; --cream-2:#e6d9c3;
    --glass:rgba(255,255,255,0.55); --glass-border:rgba(255,255,255,0.8);
    --ink:#231f1a; --ink-soft:#7a6f61; --ink-faint:#a89d8c;
    --black:#1c1815; --orange-1:#ffab6e; --orange-2:#ff6a2b; --line:rgba(35,31,26,0.12); --white:#ffffff;
  }
  *{box-sizing:border-box;} body{margin:0;}
  #app{position:relative;font-family:'Inter', sans-serif;color:var(--ink);min-height:100vh;padding:36px 18px 70px;
    background:radial-gradient(ellipse 900px 600px at 15% -10%, #f6efe3 0%, transparent 60%),
      radial-gradient(ellipse 700px 700px at 105% 15%, #e9c9a6 0%, transparent 55%),
      linear-gradient(180deg, var(--cream) 0%, var(--cream-2) 100%); overflow:hidden;}
  .blob{position:absolute;border-radius:50%;filter:blur(70px);z-index:0;pointer-events:none;}
  .blob1{width:420px;height:420px;top:-140px;right:-120px;background:radial-gradient(circle at 30% 30%,#ffd9ae,#ff9a4d 70%);opacity:.55;}
  .blob2{width:320px;height:320px;bottom:-100px;left:-100px;background:radial-gradient(circle at 40% 40%,#fff,#e7dcc6 75%);opacity:.7;}
  .blob3{width:200px;height:200px;bottom:20%;right:6%;background:radial-gradient(circle at 35% 35%,#ffe4c4,#ff8a3d 80%);opacity:.35;}
  .wrap{max-width:900px;margin:0 auto;position:relative;z-index:1;}
  .topbar{display:flex;flex-direction:column;align-items:center;gap:18px;margin-bottom:30px;}
  .logo-banner{
    width:100%;display:flex;align-items:center;justify-content:center;gap:26px;
    background:var(--glass-strong,var(--glass));backdrop-filter:blur(18px);border:1px solid var(--glass-border);
    border-radius:24px;padding:20px 28px;box-shadow:0 14px 34px -18px rgba(35,31,26,0.22);flex-wrap:wrap;
  }
  .logos{display:flex;align-items:center;gap:26px;flex-wrap:wrap;justify-content:center;}
  .logo-img{height:76px;max-width:220px;object-fit:contain;}
  .logo-sep{width:1px;height:52px;background:var(--line);}
  .logo-ph{height:76px;padding:0 26px;border-radius:16px;background:rgba(255,255,255,0.5);border:1px dashed var(--line);display:flex;align-items:center;font-family:'Sora',sans-serif;font-weight:700;font-size:16px;color:var(--ink-soft);}
  .tabs{display:flex;gap:4px;background:var(--glass);backdrop-filter:blur(16px);padding:5px;border-radius:999px;border:1px solid var(--glass-border);}
  .tab-btn{font-family:'Sora',sans-serif;font-size:12.5px;font-weight:600;padding:9px 18px;border-radius:999px;border:none;cursor:pointer;background:transparent;color:var(--ink-soft);}
  .tab-btn.active{background:var(--black);color:#fff;}
  .card{background:var(--glass);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);border:1px solid var(--glass-border);border-radius:28px;padding:30px;box-shadow:0 20px 50px -20px rgba(35,31,26,0.18);}
  .card + .card{margin-top:18px;}
  h2.section-title{font-family:'Sora',sans-serif;font-weight:700;font-size:20px;margin:0 0 4px;letter-spacing:-.01em;}
  .subtle{color:var(--ink-soft);font-size:13.5px;margin:0 0 18px;line-height:1.5;}
  .subnav{display:flex;gap:8px;margin-bottom:22px;flex-wrap:wrap;}
  .subnav button{font-family:'Sora',sans-serif;font-size:12.5px;font-weight:600;padding:8px 14px;border-radius:12px;border:1px solid var(--line);background:var(--white);cursor:pointer;color:var(--ink-soft);}
  .subnav button.active{background:var(--black);color:#fff;border-color:var(--black);}
  label.fieldlabel{display:block;font-family:'Sora',sans-serif;font-size:11px;text-transform:uppercase;color:var(--ink-soft);letter-spacing:.05em;margin-bottom:6px;}
  input[type=text],input[type=email],input[type=tel],textarea,select{width:100%;padding:11px 13px;border-radius:12px;border:1px solid var(--line);background:var(--white);color:var(--ink);font-family:'Inter',sans-serif;font-size:14px;}
  textarea{resize:vertical;min-height:80px;}
  input[type=time],input[type=number],input[type=date]{padding:8px 10px;border-radius:10px;border:1px solid var(--line);background:var(--white);font-family:'IBM Plex Mono',monospace;font-size:13px;color:var(--ink);}
  .btn-black{font-family:'Sora',sans-serif;font-weight:700;font-size:13.5px;background:var(--black);color:#fff;border:none;border-radius:999px;padding:12px 22px;cursor:pointer;display:inline-flex;align-items:center;gap:8px;}
  .btn-black:hover{background:#000;}
  .btn-black .arrow{width:20px;height:20px;border-radius:50%;background:var(--orange-2);display:flex;align-items:center;justify-content:center;font-size:11px;}
  .btn-ghost{font-family:'Sora',sans-serif;font-weight:600;font-size:13px;background:transparent;border:1.5px solid var(--black);color:var(--black);border-radius:999px;padding:10px 18px;cursor:pointer;}
  .btn-danger-sm{font-family:'Sora',sans-serif;font-weight:600;font-size:11.5px;background:transparent;border:none;color:#c0472a;cursor:pointer;text-decoration:underline;}
  .save-msg{font-size:12px;color:var(--orange-2);margin-left:8px;font-family:'Sora',sans-serif;font-weight:600;}
  .back-link{font-family:'Sora',sans-serif;font-weight:600;font-size:12.5px;color:var(--ink-soft);background:none;border:none;cursor:pointer;display:flex;align-items:center;gap:6px;margin-bottom:16px;}
  .position-card{border:1px solid var(--line);border-radius:20px;padding:20px;margin-bottom:16px;background:rgba(255,255,255,0.5);}
  .position-head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:14px;flex-wrap:wrap;}
  .position-head input[type=text]{font-family:'Sora',sans-serif;font-weight:700;font-size:16px;border:none;background:transparent;padding:4px 0;max-width:260px;}
  .dur-row{display:flex;gap:20px;align-items:center;margin-bottom:16px;flex-wrap:wrap;}
  .dur-field{display:flex;align-items:center;gap:8px;}
  .dur-field span{font-size:12.5px;color:var(--ink-soft);font-family:'Sora',sans-serif;font-weight:600;}
  .day-block{border-bottom:1px dashed var(--line);padding:10px 0;}
  .day-block:last-child{border-bottom:none;}
  .day-block-head{display:flex;align-items:center;gap:10px;margin-bottom:8px;}
  .switch{position:relative;width:36px;height:20px;flex-shrink:0;}
  .switch input{opacity:0;width:0;height:0;}
  .slider{position:absolute;cursor:pointer;inset:0;background:var(--line);border-radius:999px;transition:.15s;}
  .slider:before{content:"";position:absolute;height:14px;width:14px;left:3px;top:3px;background:#fff;border-radius:50%;transition:.15s;}
  input:checked + .slider{background:var(--black);} input:checked + .slider:before{transform:translateX(16px);}
  .day-name{font-family:'Sora',sans-serif;font-weight:600;font-size:13.5px;width:80px;}
  .ranges{display:flex;flex-direction:column;gap:8px;margin-left:46px;}
  .range-row{display:flex;align-items:center;gap:8px;}
  .range-sep{color:var(--ink-faint);font-size:12px;}
  .add-range-btn{font-family:'Sora',sans-serif;font-size:11.5px;font-weight:600;color:var(--orange-2);background:none;border:none;cursor:pointer;margin-left:46px;margin-top:2px;}
  .rm-range{background:none;border:none;color:var(--ink-faint);cursor:pointer;font-size:14px;}
  .logo-upload-row{display:flex;gap:20px;flex-wrap:wrap;}
  .logo-slot{width:150px;height:90px;border:1.5px dashed var(--line);border-radius:16px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;background:var(--white);position:relative;overflow:hidden;}
  .logo-slot img{max-width:100%;max-height:100%;object-fit:contain;padding:8px;}
  .logo-slot .up-label{font-family:'Sora',sans-serif;font-size:11.5px;color:var(--ink-soft);font-weight:600;}
  .logo-slot input[type=file]{position:absolute;inset:0;opacity:0;cursor:pointer;}
  .logo-remove{position:absolute;top:4px;right:4px;background:var(--black);color:#fff;border:none;border-radius:50%;width:20px;height:20px;font-size:11px;cursor:pointer;z-index:2;}
  .booking-item{display:flex;justify-content:space-between;align-items:center;padding:11px 0;border-bottom:1px dashed var(--line);font-size:13.5px;flex-wrap:wrap;gap:6px;}
  .booking-item:last-child{border-bottom:none;}
  .b-name{font-weight:600;} .b-pos{font-family:'Sora',sans-serif;font-size:11px;color:var(--orange-2);font-weight:700;}
  .b-when{font-family:'IBM Plex Mono',monospace;font-size:12.5px;color:var(--ink-soft);}
  .empty{color:var(--ink-soft);font-size:13.5px;font-style:italic;}
  .intro-title{font-family:'Sora',sans-serif;font-weight:800;font-size:26px;letter-spacing:-.01em;margin:0 0 12px;line-height:1.2;}
  .intro-msg{white-space:pre-wrap;font-size:14.5px;line-height:1.65;color:var(--ink);margin-bottom:22px;}
  .grid-2{display:grid;grid-template-columns:1.1fr 1fr;gap:20px;} @media (max-width:680px){.grid-2{grid-template-columns:1fr;}}
  .date-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:8px;max-height:340px;overflow-y:auto;padding-right:4px;}
  .date-chip{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:10px 4px;border:1px solid var(--line);border-radius:14px;cursor:pointer;background:var(--white);transition:.12s;}
  .date-chip .dow{font-family:'Sora',sans-serif;font-size:10px;color:var(--ink-soft);text-transform:uppercase;font-weight:700;}
  .date-chip .dnum{font-family:'Sora',sans-serif;font-weight:800;font-size:20px;}
  .date-chip .dmon{font-size:10px;color:var(--ink-soft);}
  .date-chip.selected{background:linear-gradient(135deg,var(--orange-1),var(--orange-2));color:#fff;border-color:transparent;}
  .date-chip.selected .dow,.date-chip.selected .dmon{color:rgba(255,255,255,0.85);}
  .slot-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(78px,1fr));gap:8px;}
  .slot-btn{font-family:'IBM Plex Mono',monospace;font-size:13px;padding:9px 6px;border:1px solid var(--line);border-radius:10px;background:var(--white);cursor:pointer;text-align:center;}
  .slot-btn:hover{border-color:var(--black);}
  .slot-btn.selected{background:linear-gradient(135deg,var(--orange-1),var(--orange-2));border-color:transparent;color:#fff;}
  .locked-field{background:rgba(35,31,26,0.05);border-radius:12px;padding:10px 13px;font-size:13.5px;margin-bottom:14px;display:flex;justify-content:space-between;align-items:center;}
  .locked-field .lval{font-weight:600;font-family:'Sora',sans-serif;}
  form.contact-form > *{margin-bottom:14px;}
  .confirm-badge{display:inline-flex;align-items:center;gap:8px;background:linear-gradient(135deg,var(--orange-1),var(--orange-2));color:#fff;font-family:'Sora',sans-serif;font-weight:700;font-size:12px;padding:6px 14px;border-radius:999px;margin-bottom:16px;}
  .confirm-detail{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px dashed var(--line);font-size:13.5px;}
  .confirm-detail:last-child{border-bottom:none;}
  .confirm-detail .k{color:var(--ink-soft);} .confirm-detail .v{font-weight:600;font-family:'Sora',sans-serif;}
  .confirm-msg{white-space:pre-wrap;font-size:14px;line-height:1.6;margin-top:18px;padding-top:18px;border-top:1px solid var(--line);}
  .actions-row{display:flex;gap:10px;margin-top:20px;flex-wrap:wrap;}
  .notice{font-size:12px;color:var(--ink-soft);margin-top:16px;line-height:1.55;border-top:1px dashed var(--line);padding-top:12px;}
  .loading{padding:40px;text-align:center;color:var(--ink-soft);font-family:'Sora',sans-serif;font-size:13px;}
  .conn-banner{background:#3a2e22;color:#f3e6d3;border-radius:16px;padding:16px 20px;margin-bottom:18px;font-size:13px;line-height:1.6;}
  .conn-banner code{background:rgba(255,255,255,0.15);padding:1px 6px;border-radius:6px;}
  .search-row{display:flex;gap:10px;margin-bottom:20px;}
  .search-row input{flex:1;}
  .candidate-card{border:1px solid var(--line);border-radius:16px;padding:16px 18px;margin-bottom:12px;background:rgba(255,255,255,0.5);}
  .candidate-top{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;margin-bottom:8px;}
  .candidate-name{font-family:'Sora',sans-serif;font-weight:700;font-size:15px;}
  .candidate-tags{display:flex;gap:6px;flex-wrap:wrap;}
  .tag{font-family:'IBM Plex Mono',monospace;font-size:11px;background:rgba(35,31,26,0.06);padding:3px 9px;border-radius:999px;color:var(--ink-soft);}
  .candidate-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px 16px;font-size:12.5px;}
  .candidate-grid .k{color:var(--ink-soft);display:block;font-family:'Sora',sans-serif;font-size:10.5px;text-transform:uppercase;letter-spacing:.04em;}
  .interview-form{margin-top:14px;padding-top:14px;border-top:1px dashed var(--line);display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  .interview-form > div{grid-column:span 1;}
  .interview-form .full{grid-column:1 / -1;}
  @media (max-width:600px){.interview-form{grid-template-columns:1fr;}}
  @media (max-width:640px){
    #app{padding:18px 12px 50px;}
    .logo-banner{padding:14px 16px;gap:14px;}
    .logo-img{height:48px;max-width:140px;}
    .logo-ph{height:48px;padding:0 16px;font-size:13px;}
    .tabs{width:100%;overflow-x:auto;justify-content:flex-start;}
    .tab-btn{padding:8px 14px;white-space:nowrap;}
    .subnav{overflow-x:auto;flex-wrap:nowrap;padding-bottom:4px;}
    .subnav button{white-space:nowrap;}
    .card{padding:20px 16px;border-radius:20px;}
    .intro-title{font-size:21px;}
    .grid-2{gap:16px;}
    .date-list{grid-template-columns:repeat(auto-fill,minmax(52px,1fr));}
    .slot-grid{grid-template-columns:repeat(auto-fill,minmax(68px,1fr));}
    .btn-black, .btn-ghost{padding:11px 16px;font-size:13px;}
    .position-head input[type=text]{max-width:100%;font-size:15px;}
    .dur-row{gap:12px;}
    .ranges{margin-left:0;}
    .add-range-btn{margin-left:0;}
    .booking-item > div:first-child{width:100%;}
  }
</style>

<div id="app"><div class="loading">Cargando…</div></div>

<script>
// ======================================================================
// CONFIGURACIÓN DE CONEXIÓN
// Pegá acá la URL de tu Web App de Apps Script (ver README), o agregá
// ?backend=TU_URL al final del link publicado para probarlo sin editar código.
// ======================================================================
const params = new URLSearchParams(window.location.search);
const BACKEND_URL = params.get('backend') || 'https://script.google.com/macros/s/AKfycbz512T0navmKsgMMRQbpkAdE5p-8C2DUZ3FyL8ZYvaw9o4o1i2vqR8Daj_Bc7SV8MEa/exec';

const DAYS = [
  {key:'sun', label:'Domingo', short:'Dom'}, {key:'mon', label:'Lunes', short:'Lun'},
  {key:'tue', label:'Martes', short:'Mar'}, {key:'wed', label:'Miércoles', short:'Mié'},
  {key:'thu', label:'Jueves', short:'Jue'}, {key:'fri', label:'Viernes', short:'Vie'},
  {key:'sat', label:'Sábado', short:'Sáb'},
];
const MONTHS = ['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
const LOCAL_DESTINO_OPTS = ['Florinda','IPA','Florinda Acoyte','Florinda Marechal','IPA Acoyte','IPA San Martin','Todos'];
const MODALIDAD_OPTS = ['Fija','Eventual','Findes','Pref Fija','Pref Eventual'];

function uid(){ return Date.now().toString(36)+'-'+Math.random().toString(36).slice(2,7); }
function pad(n){return n.toString().padStart(2,'0');}
function dateKey(d){ return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); }
function escapeHtml(s){ const d = document.createElement('div'); d.innerText = s ?? ''; return d.innerHTML; }
function fmtDateLong(d){ return DAYS[d.getDay()].short + ' ' + d.getDate() + ' ' + MONTHS[d.getMonth()]; }

const isConfigured = BACKEND_URL && BACKEND_URL.indexOf('http') === 0;

// ---------- Cliente de la API (Apps Script) ----------
async function apiGet(action, extraParams){
  const url = new URL(BACKEND_URL);
  url.searchParams.set('action', action);
  url.searchParams.set('token', state.adminToken || '');
  Object.entries(extraParams||{}).forEach(([k,v])=> url.searchParams.set(k, v));
  const res = await fetch(url.toString());
  const data = await res.json();
  if(!data.ok) throw new Error(data.error || 'Error de servidor');
  return data;
}
async function apiPost(body){
  // Sin headers custom a propósito: así el navegador manda text/plain y
  // Apps Script no exige un preflight CORS que no sabe responder.
  body.token = state.adminToken || '';
  const res = await fetch(BACKEND_URL, { method:'POST', body: JSON.stringify(body) });
  const data = await res.json();
  if(!data.ok) throw new Error(data.error || 'Error de servidor');
  return data;
}

const DEFAULT_MESSAGES = {
  introTitle: 'Reservá tu entrevista',
  intro: 'Gracias por tu interés en sumarte al equipo.\nElegí el puesto al que te postulás y después una fecha y horario disponible para tu entrevista.',
  confirmation: 'Tu entrevista para el puesto de {puesto} quedó confirmada para el {fecha} a las {hora}.\nTe esperamos con puntualidad. ¡Gracias por postularte!'
};

let state = {
  view: 'public', hostTab: 'marca', authed:false, adminToken:'',
  branding: {logo1:null, logo2:null},
  messages: {...DEFAULT_MESSAGES},
  notifications: { enabled:false, serviceId:'', templateId:'', publicKey:'', notifyEmail:'' },
  positions: [], bookings: [], candidates: [],
  saveMsg:'', loadError:'',
  step: 'intro', selectedPositionId: null, selectedDate: null, selectedSlot: null,
  availableDates: [], availableSlots: [],
  confirmed: null,
  candidateSearchQuery:'', candidateSearchResults:[], candidateSearchDone:false,
  openInterviewFormFor: null,
};

async function loadPublicConfig(){
  const r = await apiGet('getConfig');
  state.branding = r.config.branding;
  state.messages = { ...DEFAULT_MESSAGES, ...r.config.messages };
  state.notifications = r.config.notifications || state.notifications;
  state.positions = r.config.positions || [];
}
async function loadHostData(){
  await loadPublicConfig();
  const [b, c] = await Promise.all([ apiGet('getBookings'), apiGet('searchCandidates', {q:''}) ]);
  state.bookings = b.bookings;
  state.candidates = c.candidates;
}
async function saveConfigToServer(flashMsg){
  try{
    await apiPost({ action:'saveConfig', config: { branding: state.branding, messages: state.messages, notifications: state.notifications, positions: state.positions } });
    if(flashMsg){ state.saveMsg = 'Guardado ✓'; render(); setTimeout(()=>{state.saveMsg='';render();},2000); }
  }catch(e){ state.saveMsg = 'Error: ' + e.message; render(); }
}

function switchView(v){
  state.view = v; state.step='intro'; state.selectedPositionId=null; state.selectedDate=null; state.selectedSlot=null; state.confirmed=null;
  if(v==='host' && state.authed){ loadHostData().then(render).catch(e=>{ state.loadError = e.message; render(); }); }
  render();
}

async function tryAdminLogin(token){
  state.adminToken = token;
  try{
    await loadHostData();
    state.authed = true;
    sessionStorage.setItem('adminToken', token);
    state.loadError = '';
    render();
  }catch(e){
    alert('Token incorrecto: ' + e.message);
  }
}

function rangesForPositionDate(pos, d){
  const key = dateKey(d);
  const specific = (pos.specificDates||[]).find(sd=>sd.date===key);
  if(specific) return specific.ranges || [];
  const cfg = pos.days[DAYS[d.getDay()].key];
  if(!cfg || !cfg.enabled) return [];
  return cfg.ranges || [];
}
function emptyDays(){
  const o = {}; DAYS.forEach(d=>{ o[d.key] = {enabled:false, ranges:[]}; });
  o.mon = {enabled:true, ranges:[{start:'09:00',end:'13:00'},{start:'14:00',end:'18:00'}]};
  o.tue = {enabled:true, ranges:[{start:'09:00',end:'13:00'},{start:'14:00',end:'18:00'}]};
  o.wed = {enabled:true, ranges:[{start:'09:00',end:'13:00'},{start:'14:00',end:'18:00'}]};
  o.thu = {enabled:true, ranges:[{start:'09:00',end:'13:00'},{start:'14:00',end:'18:00'}]};
  o.fri = {enabled:true, ranges:[{start:'09:00',end:'14:00'}]};
  return o;
}
function defaultPosition(name){ return { id: uid(), name: name || 'Puesto general', duration:30, gap:10, days: emptyDays(), specificDates: [] }; }
function getPos(id){ return state.positions.find(p=>p.id===id); }

let emailJsLoaded = false;
function loadEmailJs(){
  return new Promise((resolve, reject)=>{
    if(emailJsLoaded && window.emailjs){ resolve(); return; }
    const script = document.createElement('script');
    script.src = 'https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js';
    script.onload = ()=>{ emailJsLoaded = true; resolve(); };
    script.onerror = ()=> reject(new Error('No se pudo cargar EmailJS'));
    document.head.appendChild(script);
  });
}
async function sendBookingNotification(booking){
  const n = state.notifications;
  if(!n.enabled || !n.serviceId || !n.templateId || !n.publicKey || !n.notifyEmail) return;
  try{
    await loadEmailJs();
    window.emailjs.init(n.publicKey);
    const [y,m,d] = booking.date.split('-');
    await window.emailjs.send(n.serviceId, n.templateId, {
      puesto: booking.positionName, fecha: `${d}/${m}`, hora: booking.time,
      nombre: booking.name, email: booking.email, telefono: booking.phone, to_email: n.notifyEmail,
    });
  }catch(e){ console.error('No se pudo enviar la notificación por email:', e); }
}

function buildIcs(booking, positionName){
  const [y,m,d] = booking.date.split('-').map(Number);
  const [hh,mm] = booking.time.split(':').map(Number);
  const start = new Date(y,m-1,d,hh,mm);
  const end = new Date(start.getTime() + 30*60000);
  function fmt(dt){ return dt.getFullYear()+pad(dt.getMonth()+1)+pad(dt.getDate())+'T'+pad(dt.getHours())+pad(dt.getMinutes())+'00'; }
  return ['BEGIN:VCALENDAR','VERSION:2.0','BEGIN:VEVENT','UID:'+booking.id+'@bookingapp',
    'DTSTART:'+fmt(start),'DTEND:'+fmt(end),'SUMMARY:Entrevista - '+positionName,
    'DESCRIPTION:Entrevista para el puesto de '+positionName+' con '+booking.name,'END:VEVENT','END:VCALENDAR'].join('\r\n');
}
function downloadIcs(booking, positionName){
  const content = buildIcs(booking, positionName);
  const blob = new Blob([content], {type:'text/calendar'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href = url; a.download = 'entrevista.ics'; a.click();
  URL.revokeObjectURL(url);
}

  let dateChips = state.availableDates.map(key=>{
    const [y,m,d] = key.split('-').map(Number); const dt = new Date(y,m-1,d);
    const sel = state.selectedDate===key;
    return `<div class="date-chip ${sel?'selected':''}" data-action="pick-date" data-date="${key}">
      <span class="dow">${DAYS[dt.getDay()].short}</span><span class="dnum">${dt.getDate()}</span><span class="dmon">${MONTHS[dt.getMonth()]}</span>
    </div>`;
  }).join('');
  if(!state.availableDates.length) dateChips = `<div class="empty">No hay fechas habilitadas para este puesto todavía.</div>`;
  let rightPanel = `<div class="empty">Elegí una fecha para ver los horarios.</div>`;
  if(state.selectedDate){
    const [y,m,d] = state.selectedDate.split('-').map(Number); const dt = new Date(y,m-1,d);
    let slotHtml = state.availableSlots.length ? state.availableSlots.map(t=>`<button class="slot-btn ${state.selectedSlot===t?'selected':''}" data-action="pick-slot" data-slot="${t}">${t}</button>`).join('') : `<div class="empty">No quedan horarios libres ese día.</div>`;
    rightPanel = `<h2 class="section-title">${fmtDateLong(dt)}</h2><p class="subtle">Puesto: ${escapeHtml(pos.name)}</p><div class="slot-grid">${slotHtml}</div>
      ${state.selectedSlot ? `<div style="margin-top:18px;"><button class="btn-black" data-action="go-form"><span>Continuar</span><span class="arrow">→</span></button></div>` : ''}`;
  }
  return `<button class="back-link" data-action="back-intro">← Cambiar puesto</button>
    <div class="card"><div class="grid-2">
      <div><h2 class="section-title">Elegí una fecha</h2><p class="subtle">Próximos días con disponibilidad para este puesto.</p><div class="date-list">${dateChips}</div></div>
      <div>${rightPanel}</div>
    </div></div>`;
}
function renderForm(){
  const pos = state.positions.find(p=>p.id===state.selectedPositionId);
  const [y,m,d] = state.selectedDate.split('-').map(Number); const dt = new Date(y,m-1,d);
  return `<button class="back-link" data-action="back-slot">← Elegir otro horario</button>
    <div class="card">
      <h2 class="section-title">Completá tus datos</h2>
      <p class="subtle">${fmtDateLong(dt)} · ${state.selectedSlot}hs</p>
      <div class="locked-field"><span>Puesto</span><span class="lval">${escapeHtml(pos.name)}</span></div>
      <form class="contact-form" id="contact-form">
        <div><label class="fieldlabel">Nombre completo</label><input type="text" id="f-name" required/></div>
        <div><label class="fieldlabel">Email</label><input type="email" id="f-email" required/></div>
        <div><label class="fieldlabel">Teléfono</label><input type="tel" id="f-phone" required/></div>
        <button type="submit" class="btn-black" style="width:100%;justify-content:center;"><span>Confirmar reserva</span><span class="arrow">→</span></button>
      </form>
    </div>`;
}
function renderConfirmed(){
  const b = state.confirmed; const [y,m,d] = b.date.split('-');
  return `<div class="card">
    <div class="confirm-badge">✓ Reserva confirmada</div>
    <div class="confirm-detail"><span class="k">Puesto</span><span class="v">${escapeHtml(b.positionName)}</span></div>
    <div class="confirm-detail"><span class="k">Fecha</span><span class="v">${d}/${m}</span></div>
    <div class="confirm-detail"><span class="k">Hora</span><span class="v">${b.time}hs</span></div>
    <div class="confirm-detail"><span class="k">Nombre</span><span class="v">${escapeHtml(b.name)}</span></div>
    <div class="confirm-msg">${escapeHtml(state.confirmMsg||'')}</div>
    <div class="actions-row">
      <button class="btn-black" data-action="download-ics"><span>Agregar a mi calendario</span><span class="arrow">↓</span></button>
      <button class="btn-ghost" data-action="view-public-reset">Hacer otra reserva</button>
    </div>
  </div>`;
}

// ---------------------------------------------------------------------
// HANDLERS
// ---------------------------------------------------------------------
function attachHandlers(){
  document.querySelectorAll('[data-action="view-public"]').forEach(el=>el.onclick=()=>switchView('public'));
  document.querySelectorAll('[data-action="view-host"]').forEach(el=>el.onclick=()=>switchView('host'));
  document.querySelectorAll('[data-host-tab]').forEach(el=>el.onclick=()=>{
    state.hostTab = el.dataset.hostTab;
    if(state.hostTab==='candidatos'){ state.candidateSearchDone=false; state.candidateSearchResults=[]; }
    render();
  });

  document.querySelectorAll('[data-action="upload-logo"]').forEach(el=>{
    el.onchange = ()=>{
      const file = el.files[0]; if(!file) return;
      const reader = new FileReader();
      reader.onload = async ()=>{
        try{
          const r = await apiPost({ action:'uploadLogo', dataUrl: reader.result });
          state.branding['logo'+el.dataset.n] = r.url;
          await saveConfigToServer(false);
          render();
        }catch(e){ alert('No se pudo subir el logo: ' + e.message); }
      };
      reader.readAsDataURL(file);
    };
  });
  document.querySelectorAll('[data-action="remove-logo"]').forEach(el=>{
    el.onclick = async ()=>{ state.branding['logo'+el.dataset.n] = null; await saveConfigToServer(false); render(); };
  });

  const saveMsgsBtn = document.querySelector('[data-action="save-messages"]');
  if(saveMsgsBtn){
    saveMsgsBtn.onclick = async ()=>{
      state.messages.introTitle = document.getElementById('msg-intro-title').value;
      state.messages.intro = document.getElementById('msg-intro').value;
      state.messages.confirmation = document.getElementById('msg-confirm').value;
      await saveConfigToServer(true);
    };
  }

  document.querySelectorAll('[data-action="pos-name"]').forEach(el=>{ el.oninput = ()=>{ getPos(el.dataset.pos).name = el.value; }; });
  document.querySelectorAll('[data-action="pos-duration"]').forEach(el=>{ el.oninput = ()=>{ getPos(el.dataset.pos).duration = parseInt(el.value,10)||30; }; });
  document.querySelectorAll('[data-action="pos-gap"]').forEach(el=>{ el.oninput = ()=>{ getPos(el.dataset.pos).gap = parseInt(el.value,10)||0; }; });
  document.querySelectorAll('[data-action="toggle-day"]').forEach(el=>{
    el.onchange = ()=>{
      const p = getPos(el.dataset.pos);
      p.days[el.dataset.day].enabled = el.checked;
      if(el.checked && p.days[el.dataset.day].ranges.length===0) p.days[el.dataset.day].ranges.push({start:'09:00', end:'17:00'});
      render();
    };
  });
  document.querySelectorAll('[data-action="add-range"]').forEach(el=>{ el.onclick = ()=>{ getPos(el.dataset.pos).days[el.dataset.day].ranges.push({start:'09:00', end:'17:00'}); render(); }; });
  document.querySelectorAll('[data-action="rm-range"]').forEach(el=>{ el.onclick = ()=>{ getPos(el.dataset.pos).days[el.dataset.day].ranges.splice(parseInt(el.dataset.ridx,10),1); render(); }; });
  document.querySelectorAll('input[data-rfield]').forEach(el=>{ el.onchange = ()=>{ getPos(el.dataset.pos).days[el.dataset.day].ranges[parseInt(el.dataset.ridx,10)][el.dataset.rfield] = el.value; }; });

  document.querySelectorAll('[data-action="sd-add-date"]').forEach(el=>{ el.onclick = ()=>{ getPos(el.dataset.pos).specificDates.push({date:'', ranges:[{start:'09:00',end:'17:00'}]}); render(); }; });
  document.querySelectorAll('[data-action="sd-remove"]').forEach(el=>{ el.onclick = ()=>{ getPos(el.dataset.pos).specificDates.splice(parseInt(el.dataset.sidx,10),1); render(); }; });
  document.querySelectorAll('[data-action="sd-date"]').forEach(el=>{ el.onchange = ()=>{ getPos(el.dataset.pos).specificDates[parseInt(el.dataset.sidx,10)].date = el.value; }; });
  document.querySelectorAll('[data-action="sd-add-range"]').forEach(el=>{ el.onclick = ()=>{ getPos(el.dataset.pos).specificDates[parseInt(el.dataset.sidx,10)].ranges.push({start:'09:00',end:'17:00'}); render(); }; });
  document.querySelectorAll('[data-action="sd-rm-range"]').forEach(el=>{ el.onclick = ()=>{ getPos(el.dataset.pos).specificDates[parseInt(el.dataset.sidx,10)].ranges.splice(parseInt(el.dataset.ridx,10),1); render(); }; });
  document.querySelectorAll('[data-action="sd-range"]').forEach(el=>{ el.onchange = ()=>{ getPos(el.dataset.pos).specificDates[parseInt(el.dataset.sidx,10)].ranges[parseInt(el.dataset.ridx,10)][el.dataset.rfield] = el.value; }; });

  const addPosBtn = document.querySelector('[data-action="add-position"]');
  if(addPosBtn) addPosBtn.onclick = ()=>{ state.positions.push(defaultPosition('Nuevo puesto')); render(); };
  document.querySelectorAll('[data-action="del-position"]').forEach(el=>{ el.onclick = ()=>{ state.positions = state.positions.filter(p=>p.id!==el.dataset.pos); render(); }; });
  const savePosBtn = document.querySelector('[data-action="save-positions"]');
  if(savePosBtn) savePosBtn.onclick = ()=> saveConfigToServer(true);

  const saveNotifBtn = document.querySelector('[data-action="save-notifications"]');
  if(saveNotifBtn){
    saveNotifBtn.onclick = async ()=>{
      state.notifications = {
        enabled: document.getElementById('notif-enabled').checked,
        notifyEmail: document.getElementById('notif-email').value.trim(),
        serviceId: document.getElementById('notif-service').value.trim(),
        templateId: document.getElementById('notif-template').value.trim(),
        publicKey: document.getElementById('notif-key').value.trim(),
      };
      await saveConfigToServer(true);
    };
  }

  document.querySelectorAll('[data-action="cancel-booking"]').forEach(el=>{
    el.onclick = async ()=>{
      try{ await apiPost({action:'deleteBooking', id: el.dataset.id}); await loadHostData(); render(); }
      catch(e){ alert('No se pudo cancelar: ' + e.message); }
    };
  });

  document.querySelectorAll('[data-action="toggle-interview"]').forEach(el=>{
    el.onclick = ()=>{ state.openInterviewFormFor = state.openInterviewFormFor===el.dataset.id ? null : el.dataset.id; render(); };
  });
  document.querySelectorAll('[data-action="save-interview"]').forEach(el=>{
    el.onclick = async ()=>{
      const bookingId = el.dataset.booking;
      const b = state.bookings.find(x=>x.id===bookingId);
      const form = document.querySelector(`.interview-form[data-booking="${bookingId}"]`);
      const candidate = { bookingId, nombre: b.name, email: b.email, telefono: b.phone, puesto: b.positionName };
      form.querySelectorAll('.if-field').forEach(f=>{ candidate[f.dataset.field] = f.value; });
      try{
        await apiPost({ action:'saveCandidate', candidate });
        state.saveMsg = 'Ficha guardada ✓';
        const c = await apiGet('searchCandidates', {q:''});
        state.candidates = c.candidates;
        if(state.candidateSearchDone){
          const r2 = await apiGet('searchCandidates', {q: state.candidateSearchQuery});
          state.candidateSearchResults = r2.candidates;
        }
        state.openInterviewFormFor = null;
        render(); setTimeout(()=>{state.saveMsg='';render();},2000);
      }catch(e){ alert('No se pudo guardar la ficha: ' + e.message); }
    };
  });
  document.querySelectorAll('[data-action="delete-candidate"]').forEach(el=>{
    el.onclick = async ()=>{
      if(!confirm('¿Eliminar la ficha de este candidato? Esto no borra la reserva, solo la ficha de entrevista.')) return;
      try{
        await apiPost({ action:'deleteCandidate', bookingId: el.dataset.id });
        const c = await apiGet('searchCandidates', {q:''});
        state.candidates = c.candidates;
        if(state.candidateSearchDone){
          const r2 = await apiGet('searchCandidates', {q: state.candidateSearchQuery});
          state.candidateSearchResults = r2.candidates;
        }
        render();
      }catch(e){ alert('No se pudo eliminar: ' + e.message); }
    };
  });

  const searchBtn = document.querySelector('[data-action="do-search"]');
  if(searchBtn){
    searchBtn.onclick = async ()=>{
      state.candidateSearchQuery = document.getElementById('candidate-search-input').value;
      try{
        const r = await apiGet('searchCandidates', {q: state.candidateSearchQuery});
        state.candidateSearchResults = r.candidates; state.candidateSearchDone = true; render();
      }catch(e){ alert('Error al buscar: ' + e.message); }
    };
  }

  const goDateBtn = document.querySelector('[data-action="go-date"]');
  if(goDateBtn){
    goDateBtn.onclick = async ()=>{
      const sel = document.getElementById('position-select');
      state.selectedPositionId = sel.value; state.step = 'date'; state.selectedDate=null; state.selectedSlot=null;
      try{ const r = await apiGet('getDates', {positionId: state.selectedPositionId}); state.availableDates = r.dates; render(); }
      catch(e){ alert('Error: ' + e.message); }
    };
  }
  document.querySelectorAll('[data-action="back-intro"]').forEach(el=>el.onclick=()=>{ state.step='intro'; state.selectedDate=null; state.selectedSlot=null; render(); });
  document.querySelectorAll('[data-action="back-slot"]').forEach(el=>el.onclick=()=>{ state.step='date'; state.selectedSlot=null; render(); });
  document.querySelectorAll('[data-action="pick-date"]').forEach(el=>{
    el.onclick = async ()=>{
      state.selectedDate = el.dataset.date; state.selectedSlot=null;
      try{ const r = await apiGet('getSlots', {positionId: state.selectedPositionId, date: state.selectedDate}); state.availableSlots = r.slots; render(); }
      catch(e){ alert('Error: ' + e.message); }
    };
  });
  document.querySelectorAll('[data-action="pick-slot"]').forEach(el=>{ el.onclick = ()=>{ state.selectedSlot = el.dataset.slot; render(); }; });
  const goFormBtn = document.querySelector('[data-action="go-form"]');
  if(goFormBtn){ goFormBtn.onclick = ()=>{ state.step='form'; render(); }; }

  const form = document.getElementById('contact-form');
  if(form){
    form.onsubmit = async (e)=>{
      e.preventDefault();
      const name = document.getElementById('f-name').value.trim();
      const email = document.getElementById('f-email').value.trim();
      const phone = document.getElementById('f-phone').value.trim();
      if(!name||!email||!phone) return;
      try{
        const r = await apiPost({ action:'createBooking', booking:{ positionId: state.selectedPositionId, date: state.selectedDate, time: state.selectedSlot, name, email, phone } });
        state.confirmed = r.booking; state.confirmMsg = r.confirmationMessage; state.step='confirmed';
        sendBookingNotification(r.booking);
        render();
      }catch(err){
        alert(err.message);
        state.selectedSlot = null; state.step = 'date';
        try{ const r2 = await apiGet('getSlots', {positionId: state.selectedPositionId, date: state.selectedDate}); state.availableSlots = r2.slots; }catch(e2){}
        render();
      }
    };
  }
  const icsBtn = document.querySelector('[data-action="download-ics"]');
  if(icsBtn){ icsBtn.onclick = ()=> downloadIcs(state.confirmed, state.confirmed.positionName); }
  const resetBtn = document.querySelector('[data-action="view-public-reset"]');
  if(resetBtn){ resetBtn.onclick = ()=> switchView('public'); }
}

// ---------------------------------------------------------------------
// INIT
// ---------------------------------------------------------------------
(async function init(){
  if(!isConfigured){ render(); return; }
  const saved = sessionStorage.getItem('adminToken');
  if(saved) state.adminToken = saved;
  try{ await loadPublicConfig(); }
  catch(e){ state.loadError = e.message; render(); return; }
  if(saved){
    try{ await loadHostData(); state.authed = true; }catch(e){ state.authed = false; state.adminToken=''; }
  }
  render();
})();
</script>


</body>
</html>
